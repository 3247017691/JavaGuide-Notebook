  <meta name="description" content="macOS 风格的面试工作台：JavaGuide 离线小抄与 JBL 火箭题库装进同一块液态玻璃桌面。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='%23101b30'/%3E%3Cpath%20d='M12%204.5c1.9%201.8%202.8%204.2%202.8%206.9%200%201.7-.4%203.4-1%204.8h-3.6c-.6-1.4-1-3.1-1-4.8%200-2.7.9-5.1%202.8-6.9z'%20fill='%23ff6a3d'/%3E%3C/svg%3E">
  <!-- 深色档在样式落地前贴好：Element Plus 的 dark 变量走 html.dark，
       不这么做的话「跟随系统=深色」时首帧会先闪一下白。 -->
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('desk:prefs') || '{}') || {};
        var t = p.theme;
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <script type="module" crossorigin src="/assets/index-Bp6c3QOU.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Qq5KGHX0.css">

</body>
