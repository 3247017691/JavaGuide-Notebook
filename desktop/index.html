<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面试工作台</title>
<meta name="description" content="把 JavaGuide 离线小抄与 JBL 火箭题库装进同一块 macOS 风格桌面：侧边栏切模块、工具栏搜索、内容区多标签。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='%23101b30'/%3E%3Cpath%20d='M12%204.5c1.9%201.8%202.8%204.2%202.8%206.9%200%201.7-.4%203.4-1%204.8h-3.6c-.6-1.4-1-3.1-1-4.8%200-2.7.9-5.1%202.8-6.9z'%20fill='%23ff6a3d'/%3E%3C/svg%3E">
<!-- 外观在样式落地前定档：默认（无 data-desk-theme）走 CSS 的浅色，
     JS 把 auto 解析成 light|dark 写在这个属性上，刷新时不会闪一下另一套底色。
     属性名带 desk- 前缀：宿主环境（嵌入式预览、扩展）也会往 <html> 上写 data-theme。 -->
<script>
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('desk:prefs') || '{}') || {};
    var t = p.theme;
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.dataset.deskTheme = t;
    if (p.opaque) document.documentElement.dataset.deskOpaque = '1';
  } catch (e) { }
})();
</script>
<link rel="stylesheet" href="/desktop/desktop.css?v=20260915d">
</head>
<body>

<a class="skip" href="#dock">跳到程序坞</a>

<!-- 壁纸：同一套山脊剪影，浅是晨间、深是黄昏，全部由 token 驱动 -->
<div class="wallpaper" aria-hidden="true">
  <div class="wp-sky"></div>
  <div class="wp-stars"></div>
  <div class="wp-glow"></div>
  <svg class="wp-ridge wp-ridge-far" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <path d="M0 238C60 214 120 190 190 224 250 252 300 236 360 196 430 150 500 210 560 232 640 260 690 200 760 168 830 138 900 208 980 236 1050 260 1110 214 1180 190 1260 164 1330 218 1440 244L1440 320 0 320Z"/>
  </svg>
  <svg class="wp-ridge wp-ridge-near" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <path d="M0 282C80 258 150 238 240 268 330 296 400 250 500 232 600 214 660 268 760 284 860 300 940 252 1040 240 1140 228 1220 272 1320 284 1370 290 1410 280 1440 268L1440 320 0 320Z"/>
  </svg>
</div>

<!-- 菜单栏：左侧一级菜单（JS 生成），右侧状态项。每一项也都能用键盘走到 -->
<header class="menubar" role="menubar" aria-label="系统菜单栏">
  <button class="mb-item mb-logo" id="mb-logo" type="button" data-menu="sys"
          aria-haspopup="menu" aria-expanded="false" aria-label="工作台菜单">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.6c2 1.9 3 4.5 3 7.3 0 1.8-.4 3.6-1.1 5.1h-3.8c-.7-1.5-1.1-3.3-1.1-5.1 0-2.8 1-5.4 3-7.3z"/>
      <circle cx="12" cy="9.6" r="1.5"/>
      <path d="m9.2 13.8-2.5 3.8 3-1.1M14.8 13.8l2.5 3.8-3-1.1M10.9 18.2c.2 1.5.6 2.6 1.1 3.6.5-1 .9-2.1 1.1-3.6"/>
    </svg>
  </button>
  <button class="mb-item mb-app" id="mb-app" type="button" data-menu="app"
          aria-haspopup="menu" aria-expanded="false">面试工作台</button>
  <nav id="mb-menus" class="mb-menus" aria-label="应用菜单"></nav>
  <span class="mb-grow"></span>
  <button class="mb-item db-chip" id="db-chip" type="button" title="进度库：小抄划线与题库掌握记录存于本机 MySQL">
    <span class="led" id="db-led"></span><span class="db-t" id="db-text">进度库检测中</span>
  </button>
  <button class="mb-item mb-theme" id="mb-theme" type="button" aria-label="外观">外观</button>
  <button class="mb-item mb-clock" id="mb-clock" type="button" title="关于本机">&nbsp;</button>
</header>

<!-- 桌面：图标层 + 窗口层 -->
<main class="stage" id="stage">
  <div class="desk-icons" id="desk-icons" aria-label="桌面图标"></div>
  <div class="win-layer" id="win-layer"></div>
</main>

<!-- 程序坞：左侧应用，分隔线之后是最小化的窗口 -->
<footer class="dock-wrap">
  <nav class="dock" id="dock" aria-label="程序坞"></nav>
</footer>

<script src="/desktop/apps.js?v=20260915"></script>
<script src="/desktop/desktop.js?v=20260915d"></script>
</body>
</html>
