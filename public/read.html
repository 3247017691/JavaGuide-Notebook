<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 · JavaGuide 离线小抄</title>
<meta name="description" content="JavaGuide 离线正文：左侧便签目录可折叠、可逐节划掉，右上盖章标记整篇已读。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f9f6ee'/%3E%3Crect width='32' height='5' fill='%232f6db0'/%3E%3Cpath d='M32 0v9l-9-9z' fill='%23dcd3be'/%3E%3Crect x='6' y='12' width='20' height='2.5' fill='%2317181a'/%3E%3Crect x='6' y='18' width='13' height='2.5' fill='%23b0492f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/cheat.css">
<!-- 模式与字号在样式生效前落到 <html> 上：三页共用同一对 localStorage 键，
     不这么做的话白昼↔夜读切换后跳页会先闪一下另一套底色。没手动选过时留空，
     交给 cheat.css 里的 prefers-color-scheme 兜底。 -->
<script>
(function () {
  var d = document.documentElement;
  try {
    var m = localStorage.getItem("read-mode");
    if (m === "day" || m === "night") { d.dataset.mode = m; }
    var s = localStorage.getItem("read-size");
    d.dataset.size = (s === "s" || s === "l") ? s : "m";
  } catch (e) { d.dataset.size = "m"; }
})();
</script>
</head>
<body>
<a class="skip" href="#r-body">跳到正文</a>

<div class="read-sheet">
  <!-- DOM 顺序：纸面在前、目录在后；窄屏塌成单栏时正好是「正文在上、目录在下」 -->
  <main class="read-clip">
    <i class="fold" aria-hidden="true"></i>
    <header class="read-band" id="band" style="--ch:#55606a">
      <a class="crumb" href="/">桌面</a>
      <span class="crumb" id="crumb"><span class="sep">/</span>—</span>
      <span class="spacer"></span>
      <button class="stamp-btn" id="stamp" type="button" aria-pressed="false" title="标记为已读">标记已读</button>
    </header>
    <div class="read-wrap">
      <div>
        <div class="read-head">
          <h1 class="read-title" id="r-title"><span class="loading-line">铺开小抄</span></h1>
          <div class="read-sub" id="r-sub"></div>
        </div>
        <article class="article" id="r-body"></article>
      </div>
      <footer class="read-foot" id="r-foot"></footer>
    </div>
  </main>
  <nav class="toc" id="r-toc" aria-label="本节目录"></nav>

  <!-- 右侧留白里的竖向导航（圆形按钮 = 穿孔的圆形语言）。
       宽屏是纸面右边的第三列，正好落在纸面右侧那条空白里（正文限宽 780px、纸面 1010px）；
       窄屏没有这条留白，改用右下角一小摞 —— 宁可压住角落，也不为了放按钮去收窄正文。 -->
  <nav class="rail" id="rail" aria-label="页面导航">
    <button class="rail-btn" id="rail-home" type="button" title="返回桌面" aria-label="返回桌面">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 10.9 12 3.9l8.4 7"/><path d="M5.8 9.4V20h12.4V9.4"/><path d="M9.9 20v-5.3h4.2V20"/></svg>
    </button>
    <button class="rail-btn" id="rail-up" type="button" title="返回上一级" aria-label="返回上一级">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 6.7 4.5 11.5l4.8 4.8"/><path d="M4.5 11.5h9.3a5.7 5.7 0 0 1 5.7 5.7v2.5"/></svg>
    </button>
    <button class="rail-btn" id="rail-top" type="button" title="返回最顶端" aria-label="返回最顶端">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 3.7h12.8"/><path d="M12 20.3V7.6"/><path d="M6.7 12.9 12 7.6l5.3 5.3"/></svg>
    </button>
    <!-- 以下两颗不是导航，是阅读偏好：太阳/月亮同一颗按钮换脸，字号那颗 A 按当前档位缩放 -->
    <button class="rail-btn" id="rail-mode" type="button" title="夜读 / 白昼" aria-label="切换夜读">
      <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8Z"/></svg>
    </button>
    <button class="rail-btn" id="rail-size" type="button" title="正文字号：小 / 标准 / 大" aria-label="切换正文字号">A</button>
  </nav>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="/colors.js"></script>
<!-- DESK_BRIDGE 必须在 read.js 之前：read.js 不是 defer/module，解析到就跑，
     它顶部的 const DESK_HOME 要在这里读到 home，否则三处程序化跳转拿不到改道目标。 -->
<script>window.DESK_BRIDGE={modeKey:"read-mode",home:"/index.html"};</script>
<script src="/read.js"></script>
<script src="/desk-bridge.js" defer></script>
</body>
</html>
